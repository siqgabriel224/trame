<!doctype html>
<html lang="pt-BR">
  <head>
    <script defer src="/compat.js"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Tramê · Impressão</title>
    <link rel="stylesheet" href="/print.css" />
    <script defer src="/domain.js"></script>
    <script defer src="/print.js"></script>
    <link rel="icon" href="/trame.ico" sizes="any" />

    <nav class="print-toolbar">
      <span id="printTitle">Preparando documento…</span
      ><label id="valuesControl"

    </nav>
    <main id="document"><p>Carregando dados salvos…</p></main>
