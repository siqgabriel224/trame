<!doctype html>
<html lang="pt-BR">
  <head>
    <link rel="stylesheet" href="/theme.css" />
    <script defer src="/compat.js"></script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Entrar · Tramê</title>
    <link rel="icon" href="/trame.ico" />
    <link rel="stylesheet" href="/access.css" />
    <script defer src="/login.js"></script>
  </head>
  <body class="login-page">
    <main class="login-card">
      <a class="login-brand" href="/login"
        ><img src="/trame.svg" width="52" height="52" alt="" />tramê</a
      >
      <p class="login-kicker">PEDIDOS E PRODUÇÃO</p>
      <h1 id="loginTitle">Entre na sua conta</h1>
      <p id="loginIntro">Use o acesso fornecido pelo administrador da empresa.</p>
      <form id="loginForm">
        <label
          >E-mail ou login antigo<input
            name="username"
            autocomplete="username"
            required
            maxlength="254"
            autofocus /></label
        ><label
          >Senha<input
            name="password"
            type="password"
            autocomplete="current-password"
            required
            maxlength="128" /></label
        ><button type="submit">Entrar</button>
      </form>
      <form id="setupForm" hidden>
        <label>Chave de primeiro acesso<input name="token" autocomplete="off" required /></label
        ><label>Seu nome<input name="name" autocomplete="name" required maxlength="150" /></label
        ><label
          >E-mail do administrador<input
            type="email"
            name="email"
            autocomplete="username"
            required
            minlength="3"
            maxlength="254" /></label
        ><label
          >Senha<input
            name="password"
            type="password"
            autocomplete="new-password"
            required
            minlength="12"
            maxlength="128" /></label
        ><label
          >Confirmar senha<input
            name="confirm"
            type="password"
            autocomplete="new-password"
            required
            minlength="12"
            maxlength="128" /></label
        ><button type="submit">Criar administrador</button>
      </form>
      <form id="passwordForm" hidden>
        <label
          >Senha atual<input
            name="currentPassword"
            type="password"
            autocomplete="current-password"
            required
            maxlength="128" /></label
        ><label
          >Nova senha<input
            name="newPassword"
            type="password"
            autocomplete="new-password"
            required
            minlength="12"
            maxlength="128" /></label
        ><label
          >Confirmar nova senha<input
            name="confirm"
            type="password"
            autocomplete="new-password"
            required
            minlength="12"
            maxlength="128" /></label
        ><button type="submit">Trocar senha</button
        ><button type="button" id="cancelPassword" class="quiet">Sair desta conta</button>
      </form>
      <p id="loginMessage" role="status" aria-live="polite"></p>
      <p>
        <button type="button" class="quiet" id="openEmailConfirmation">Confirmar meu e-mail</button>
      </p>
      <form id="emailConfirmationForm" hidden>
        <label
          >E-mail cadastrado<input
            name="email"
            type="email"
            autocomplete="email"
            required
            maxlength="254"
        /></label>
        <label
          >Código recebido<input name="code" autocomplete="one-time-code" required maxlength="64"
        /></label>
        <button type="submit">Confirmar e ativar minha conta</button>
        <button type="button" class="quiet" id="resendEmailCode">Reenviar código</button>
        <a href="/login">Voltar para entrar</a>
      </form>
      <p class="login-help" id="loginHelp">
        <button type="button" id="forgotPassword" class="quiet">Esqueci minha senha</button>
      </p>
      <form id="recoveryForm" hidden>
        <label
          >E-mail cadastrado<input
            name="email"
            type="email"
            autocomplete="email"
            required
            maxlength="254"
        /></label>
        <button type="submit">Enviar código por e-mail</button>
        <button type="button" id="haveCode" class="quiet">Já tenho um código</button>
        <a href="/login">Voltar para entrar</a>
      </form>
      <form id="resetForm" hidden>
        <label
          >E-mail cadastrado<input
            name="email"
            type="email"
            autocomplete="email"
            required
            maxlength="254"
        /></label>
        <label
          >Código recebido por e-mail<input
            name="code"
            autocomplete="one-time-code"
            required
            maxlength="64"
        /></label>
        <label
          >Nova senha<input
            name="newPassword"
            type="password"
            autocomplete="new-password"
            required
            minlength="12"
            maxlength="128"
        /></label>
        <label
          >Confirmar senha<input
            name="confirm"
            type="password"
            autocomplete="new-password"
            required
            minlength="12"
            maxlength="128"
        /></label>
        <button type="submit">Redefinir senha</button><a href="/login">Voltar para entrar</a>
      </form>
    </main>
  </body>
</html>
